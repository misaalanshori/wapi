services:
  wa-assistant:
    build: .
    environment:
      SECRET_WORD: ${SECRET_WORD}
      PROVIDER: ${PROVIDER:-opencode-go}
      PROVIDER_API_KEY: ${PROVIDER_API_KEY}
      PROVIDER_MODEL_ID: ${PROVIDER_MODEL_ID}
      FALLBACK_PROVIDER: ${FALLBACK_PROVIDER:-}
      FALLBACK_MODEL_ID: ${FALLBACK_MODEL_ID:-}
      FALLBACK_API_KEY: ${FALLBACK_API_KEY:-}
      SYSTEM_PROMPT: ${SYSTEM_PROMPT:-}
      TZ: ${TZ:-Asia/Jakarta}
      DATA_DIR: /data
      LOG_LEVEL: ${LOG_LEVEL:-info}
      COMPACTION_SOFT_LIMIT_TOKENS: ${COMPACTION_SOFT_LIMIT_TOKENS:-150000}
      COMPACTION_IDLE_MINUTES: ${COMPACTION_IDLE_MINUTES:-15}
      COMPACTION_TARGET_TOKENS: ${COMPACTION_TARGET_TOKENS:-80000}
      COMPACTION_HEAD_RATIO: ${COMPACTION_HEAD_RATIO:-1}
      COMPACTION_TAIL_RATIO: ${COMPACTION_TAIL_RATIO:-3}
      PROGRESS_MIN_STEPS: ${PROGRESS_MIN_STEPS:-3}
      PROGRESS_MIN_SECONDS: ${PROGRESS_MIN_SECONDS:-90}
    volumes:
      - ./data:/data
    restart: unless-stopped
    stdin_open: true
    tty: true
